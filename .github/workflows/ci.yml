name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [14.x]

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci
        cd ../frontend && npm ci

    - name: Lint and type check
      run: |
        npm run lint
        npm run type-check

    - name: Run backend tests
      run: |
        cd backend
        npm test

    - name: Run frontend tests
      run: |
        cd frontend
        npm test

    - name: Build backend
      run: |
        cd backend
        npm run build

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Upload backend artifact
      uses: actions/upload-artifact@v2
      with:
        name: backend-build
        path: backend/dist

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v2
      with:
        name: frontend-build
        path: frontend/build

  security-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    # Delta mode: the audit fails only on an advisory outside the baseline below. The
    # baseline is the set of advisories whose fix versions are unreachable on the pinned
    # Python 3.9 runtime. Turning this gate strict is an exit criterion of that upgrade.
    - name: Audit backend dependencies (pip-audit on backend/requirements.txt, delta mode against the committed baseline)
      run: |
        python -m pip install pip-audit
        python -m pip_audit -r backend/requirements.txt --progress-spinner off \
          --ignore-vuln PYSEC-2026-161 \
          --ignore-vuln PYSEC-2026-248 \
          --ignore-vuln PYSEC-2026-249 \
          --ignore-vuln PYSEC-2026-2280 \
          --ignore-vuln PYSEC-2026-2281 \
          --ignore-vuln PYSEC-2026-141 \
          --ignore-vuln PYSEC-2026-142 \
          --ignore-vuln PYSEC-2026-2275 \
          --ignore-vuln PYSEC-2026-2132 \
          --ignore-vuln PYSEC-2026-1374 \
          --ignore-vuln PYSEC-2026-1375 \
          --ignore-vuln GHSA-6v7p-g79w-8964 \
          --ignore-vuln PYSEC-2026-2270 \
          --ignore-vuln PYSEC-2026-3447 \
          --ignore-vuln PYSEC-2026-1845 \
          --ignore-vuln PYSEC-2026-196 \
          --ignore-vuln PYSEC-2026-2875 \
          --ignore-vuln PYSEC-2026-2876 \
          --ignore-vuln PYSEC-2026-1325 \
          --ignore-vuln GHSA-6hr6-w5qg-qmwg

    - name: Audit frontend dependencies (npm audit, known-blocked while no package-lock.json is committed)
      run: |
        npm --prefix frontend audit --audit-level=high
      continue-on-error: true

    - name: Install backend dependencies for the security tests
      run: |
        python -m pip install -r backend/requirements.txt

    - name: Verify security controls and response headers via the security test module (no live server)
      run: |
        python -m pytest backend/tests/test_security.py -q --no-header -p no:cacheprovider
