<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SECURITY: restricts the sources this document may load, and limits referrer leakage. See D9, D99 and D100. -->
    <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Excel Web Application</title>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="description" content="Web-based Excel application for data manipulation and analysis" />
    <meta property="og:title" content="Excel Web Application" />
    <meta property="og:description" content="Web-based Excel application for data manipulation and analysis" />
    <meta property="og:type" content="website" />
    <!-- og:url is deliberately absent. It must be the ABSOLUTE canonical URL, which is a per-deployment value this
         file cannot know: the domain lives in the domain_name Terraform variable and Create React App substitutes
         nothing here. It previously carried the placeholder https://your-excel-app-url.com, which named a domain
         this project does not own; a crawler that trusts it attributes the page to that domain instead. With the
         property absent a crawler falls back to the URL it requested, which is correct for every deployment. -->
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
</head>
<body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root"></div>
</body>
</html>
