<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SECURITY: restricts the sources this document may load, and limits referrer leakage.
         CONTRACT: loading directives only. connect-src, default-src and frame-ancestors must stay absent here - a meta element ignores
         frame-ancestors, and the other two are delivered per deployment by the response header (local.content_security_policy in
         infrastructure/terraform/main.tf, CSP_CONNECT_SRC_API in infrastructure/docker/nginx.conf), which this file cannot carry. -->
    <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Excel Web Application</title>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="description" content="Web-based Excel application for data manipulation and analysis" />
    <meta property="og:title" content="Excel Web Application" />
    <meta property="og:description" content="Web-based Excel application for data manipulation and analysis" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-excel-app-url.com" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
</head>
<body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root"></div>
    <script src="%PUBLIC_URL%/bundle.js"></script>
</body>
</html>
