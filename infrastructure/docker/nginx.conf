# SECURITY: emit the canonical HTTP security header set on the container-served SPA.
# This path previously delivered no security headers at all.
# See documentation/Security Decision Log.md
#
# Installed at /etc/nginx/conf.d/default.conf by infrastructure/docker/Dockerfile.frontend.

server {
    listen 80;
    server_name _;

    # Build output copied to this path by infrastructure/docker/Dockerfile.frontend.
    root /usr/share/nginx/html;
    index index.html;

    # Canonical header set. Values match the SECURITY.md header table and the constants in
    # backend/app/core/security_headers.py.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebaseinstallations.googleapis.com; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location / {
        # Client-routed paths resolve to the SPA entry point.
        try_files $uri $uri/ /index.html;
    }
}
