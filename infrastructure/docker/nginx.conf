# SECURITY: emit the canonical HTTP security header set on the container-served SPA.
#
# This file is an nginx TEMPLATE. Dockerfile.frontend installs it at
# /etc/nginx/templates/default.conf.template and the nginx image entrypoint expands the two
# CSP_ variables below into /etc/nginx/conf.d/default.conf before nginx starts.
# NGINX_ENVSUBST_FILTER=^CSP_ is set in that Dockerfile and restricts expansion to those two
# names, so the $uri references in this file reach nginx unchanged.
#
#   CSP_HEADER_NAME      Content-Security-Policy, or
#                        Content-Security-Policy-Report-Only to report without blocking.
#                        Mirrors the csp_report_only setting and the Terraform variable of
#                        that name.
#   CSP_CONNECT_SRC_API  REQUIRED. One further connect-src source, beginning with a space,
#                        for example " https://api.example.com". Mirrors the api_origin
#                        Terraform variable.
#
# Both values are validated before this template is rendered, by
# infrastructure/docker/csp-env-validate.sh, which the Dockerfile installs as
# /docker-entrypoint.d/15-csp-env-validate.sh. A header name that is not one of the two policy
# names, or an API source that is not a single leading space followed by one bare https origin,
# stops the container rather than rendering a policy that protects less than this file describes.
#
# CONTRACT: this server serves STATIC FILES ONLY. It has no proxy_pass and no API location, so
# the API is always a separate origin and the policy's 'self' never covers it. Leaving
# CSP_CONNECT_SRC_API empty renders a policy that admits no API origin, and a browser
# enforcing it then blocks every API call the application makes; it does not make this origin
# serve the API.
#
# For a given API origin and header name the rendered policy equals CONTENT_SECURITY_POLICY in
# backend/app/core/security_headers.py plus that origin, and equals the policy the
# security_response_headers local in infrastructure/terraform/main.tf renders. API responses
# carry no such addition, because on their own origin 'self' already covers them.

# Cache lifetime by class of path. This file renders into /etc/nginx/conf.d/default.conf, which
# the image's nginx.conf includes inside http{}, so a map here is in the context it needs.
#
# Create React App emits every asset under /static/ with a content hash in its file name, so a
# change produces a NEW name and the old name can never need revalidating - which is exactly
# what immutable asserts. Everything else, the entry document above all, must be revalidated on
# every request: it is the object that names which hashed bundles to load and carries the meta
# Content-Security-Policy, so a cached copy pins a browser to a superseded bundle set and a
# superseded policy. The value is consumed by ONE add_header at server level; see the note
# there for why it cannot be attached per location.
#
# The key is the STATUS as well as the path, and the status is what makes this safe. Keyed on
# the path alone, a 404 for an asset not yet published - the ordinary state of a hashed file
# during a rollout, since the document and its bundles do not land in the same instant - was
# itself returned as immutable for a year, so a browser that asked one moment too early cached
# that 404 and the application stayed broken for that client until the cache expired. Only a
# served response is immutable; every error revalidates.
# NGINX_ENVSUBST_FILTER=^CSP_ leaves these variables untouched, exactly as it already leaves the
# $uri references further down.
map "$status$uri" $excel_app_cache_control {
    default                "no-cache";
    ~^(?:200|304)/static/  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    # SECURITY: suppress the version in the Server header and on generated error pages. nginx
    # advertises "Server: nginx/<version>" by default, which hands an attacker the exact build to
    # look up known issues against, on the one origin whose whole purpose here is header
    # hardening. The header is not removed - nginx always sends it - it is reduced to "nginx".
    server_tokens off;

    # SECURITY: never name a scheme or a host in a redirect. nginx defaults to absolute_redirect
    # on, so its directory-normalisation redirect answered /static with
    # "Location: http://<host>/static/" - measured, not assumed. This server terminates no TLS: it
    # sits behind the load balancer that does, and therefore sees plain HTTP internally. So the
    # scheme it would bake into that Location is http, which downgrades a client that arrived over
    # https and discloses the internal host it derived from the Host header - the opposite of what
    # the HTTPS edge and the Strict-Transport-Security header below exist to achieve. Emitting a
    # path-only Location leaves the client resolving it against the scheme and host it actually
    # used, so the redirect cannot contradict the edge.
    absolute_redirect off;

    # Declare the encoding on every text response. nginx sends a bare "Content-Type: text/html"
    # by default, which leaves the encoding to be guessed; decoding worked here only because the
    # document happens to declare <meta charset="UTF-8"> itself, and nothing carries that
    # declaration for a JSON, JavaScript, CSS or plain-text response.
    charset utf-8;

    # charset alone is not enough, and the gap is silent. It applies only to nginx's built-in
    # charset_types list - text/html, text/xml, text/plain, text/vnd.wap.wml,
    # application/javascript, application/rss+xml - so the web manifest went out as bare
    # "application/json" and a stylesheet would go out as bare "text/css", which are exactly the
    # types the comment above claims to cover.
    # CONTRACT: this directive REPLACES the built-in list rather than extending it, so every
    # default is restated. Removing one silently drops the charset from that type. text/html is
    # deliberately NOT listed: nginx always includes it and naming it again makes nginx -t warn
    # "duplicate MIME type", which is noise in the one file whose job is to be reviewable.
    charset_types text/xml
                  text/plain
                  text/vnd.wap.wml
                  text/css
                  application/javascript
                  application/rss+xml
                  application/json
                  application/manifest+json
                  image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Canonical header set, in the directive order backend/app/core/security_headers.py
    # defines.
    # SECURITY: the configured API origin is admitted to connect-src - the policy named no
    # cross-origin API, so an enforced policy blocked every API call from the SPA.
    add_header ${CSP_HEADER_NAME} "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebaseinstallations.googleapis.com${CSP_CONNECT_SRC_API}; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # The cache policy the map above selected.
    # CONTRACT: every add_header in this file stays at THIS level. nginx inherits add_header
    # from an enclosing level ONLY when the current level declares none of its own, so a single
    # add_header inside any location below would silently drop all six security headers from
    # every response that location serves. That is why the cache value arrives through a map
    # variable rather than through a per-location add_header.
    add_header Cache-Control $excel_app_cache_control always;

    # SECURITY: refuse dotfiles outright. This server's document root is populated by
    # `gsutil rsync`-style whole-directory publishing, so anything that reaches the build output
    # is served - and a stray .env or .git/config was returned verbatim under status 200,
    # disclosing whatever it held. Matched before every rule below, and with no error_page of
    # its own, so the refusal is a real 403 rather than the entry document.
    location ~ /\. {
        deny all;
    }

    # SECURITY: refuse source maps. A map republishes the original TypeScript, including the
    # comments and any identifier the compiler dropped, to anyone who asks. The build is
    # configured not to emit them (GENERATE_SOURCEMAP=false in Dockerfile.frontend and
    # scripts/deploy.sh); this refuses one that reaches the document root by any other route.
    # Ordered ahead of the asset rule so a *.js.map is denied rather than 404-ed.
    location ~* \.map$ {
        deny all;
    }

    # An asset request terminates here. Without this rule the fallback below answered EVERY
    # unmatched path with the entry document under status 200, so a missing bundle, stylesheet,
    # icon or /robots.txt returned HTML: a status-code health check called the origin healthy
    # while it served nothing usable, a CDN cached an HTML body under a script's cache key, and
    # X-Content-Type-Options: nosniff became the only control standing between the browser and
    # executing that document as JavaScript. A security header must be defence in depth, not the
    # single thing holding the delivery path together.
    location ~* \.(?:js|mjs|cjs|css|json|webmanifest|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|eot|txt|xml|wasm)$ {
        try_files $uri =404;
    }

    location / {
        # A real directory in the document root is not a published route. try_files' $uri/
        # argument matches one, `index` then finds no index.html inside it and autoindex is off,
        # so nginx answered /static/ with 403 and the fallback never ran - a client-side route
        # colliding with a directory name showed an nginx error page instead of the application.
        # Scoped to this location, so the deny rules above still refuse with a real 403.
        error_page 403 = @spa;
        # Client-routed paths resolve to the SPA entry point.
        try_files $uri $uri/ /index.html;
    }

    # The entry document, for any client-routed path that resolves to no file.
    location @spa {
        try_files /index.html =404;
    }
}
